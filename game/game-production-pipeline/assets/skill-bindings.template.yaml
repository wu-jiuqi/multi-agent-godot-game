skill_bindings:
  schema_version: game-production-skill-bindings/v1
  project_id: "<project-id>"
  # For a UI project, bind a project-local UI dispatcher Skill (source:
  # project) and bind tool:figma-codex-plugin in that preset's frontmatter.
  # The dispatcher records which host Figma skills are required; the actual
  # host plugin is not under this repository's source_root and must not be
  # given a guessed plugin path or digest here. Record its verified schema and
  # local snapshot through assets/figma-tool-registry-entry.template.yaml.
  # The dispatcher should require, as applicable:
  #   figma-use; figma-create-new-file; figma-generate-design;
  #   figma-generate-library
  # Keep this separate from Godot runtime UI implementation, which must use
  # authored .tscn/.tres scenes.
  bindings:
    - preset_id: "preset:project:<project-id>:<agent-slug>"
      preset_digest: "<Agent Preset 摘要>"
      approval_id: "<人工审批 ID>"
      skills:
        - skill_id: "<skill-id>"
          source: "plugin | project"
          path: "<相对于插件或项目根目录的 Skill 路径>"
          digest: "<文件或目录摘要>"
skill_binding_proposal:
  schema_version: game-production-skill-binding-proposal/v1
  proposal_id: "binding:<project-id>:approved-agent-skills"
  status: approved
  canonicalization: skill-binding-subject-canonical-json-v1
  digest_scope: "skill_bindings 中递归排除 approval_id 的全部字段"
  subject_digest: "<Skill Binding subject SHA-256>"
  approval_id: "approval:<project-id>:skill-binding:<摘要前 12 位>"
  preset_count: 1
  binding_count: 1
  unique_skill_count: 1
  approval_requirement:
    human_approval_required: true
    required_approver_role: project-owner
