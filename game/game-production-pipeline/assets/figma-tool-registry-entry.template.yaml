# Optional project fragment. Do not merge this entry into
# contracts/tool-registry.template.yaml: the default fixture registry must keep
# its own digest and remain usable without a Figma host plugin.
#
# Copy the mapping into a project execution/tools.yaml only after the Codex host
# exposes the required Figma operations and the project records a local source
# snapshot. Values below are intentionally unresolved; do not replace them with
# a guessed plugin version, URL digest, or rollback promise.
figma_tool_registry_entry:
  tool_id: tool:figma-codex-plugin
  provider: <host-provider-recorded-by-project>
  name: figma
  version: <host-plugin-version-recorded-by-project>
  capabilities:
  - inspect-design-file
  - create-or-update-visual-system
  - create-prototype
  - capture-design-evidence
  permission_scope:
  - read:figma
  - write:figma
  - capture:figma
  deterministic: false
  rollback:
    # A Figma version history or duplicate is not an adapter rollback contract.
    # Change to true only after a project-local procedure is verified.
    supported: false
    procedure_ref: null
  source:
    # Figma URLs are provenance only. The registry digest must cover a local
    # adapter/schema snapshot whose bytes are available to the validator.
    path: game-pipeline/execution/tool-snapshots/figma-codex-plugin.yaml
    sha256: <sha256-of-local-source-snapshot>
  capability_verification:
    status: pending
    verified_against: <host-tool-schema-or-evidence-reference>
    verified_at: null
    evidence_refs: []
