# Legacy Figma registry entry (compatibility only). New projects use
# penpot-tool-registry-entry.template.yaml and tool:penpot-mcp.
# Figma values remain valid for existing projects during the migration window; this
# fragment must never be treated as proof that a Figma host is connected.
figma_tool_registry_entry:
  tool_id: tool:figma-codex-plugin
  provider: <host-provider-recorded-by-project>
  name: figma
  version: <host-plugin-version-recorded-by-project>
  capabilities:
  - inspect-design-file
  - create-or-update-visual-system
  - create-prototype
  - capture-design-evidence
  permission_scope:
  - read:figma
  - write:figma
  - capture:figma
  deterministic: false
  rollback:
    supported: false
    procedure_ref: null
  source:
    path: game-pipeline/execution/tool-snapshots/figma-codex-plugin.yaml
    sha256: <sha256-of-local-source-snapshot>
  capability_verification:
    status: pending
    verified_against: <host-tool-schema-or-evidence-reference>
    verified_at: null
    evidence_refs: []
