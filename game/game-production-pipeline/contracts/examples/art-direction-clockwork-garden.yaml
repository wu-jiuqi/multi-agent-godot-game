    qa_review: {reviewer: position:clockwork-garden:qa, status: approved, subject_digest: ec635eb0689e883d25f9c528f3bd78e91b21f4d04e28143770df54e98612c8c9, reviewed_at: "2026-09-02T09:00:00Z", evidence_refs: [evidence:review:qa]}
