# Local-project -> dot/cloud-browser bridge record for Penpot work.
#
# This is a file contract, not a browser driver.  The local project writes the
# request, the dot/cloud-browser worker appends an acknowledgement after its
# own connection check, and it appends a result (or an auditable failure).
# Never put a browser token, cookie, password, or private URL in this record.

penpot_browser_task:
  schema_version: game-production-penpot-browser-task/v1
  identity:
    task_id: penpot-task:<project-id>:<ulid>
    project_id: <project-id>
    revision: 1
    lifecycle_state: requested|acknowledged|completed|failed|blocked

  request:
    request_id: penpot-request:<project-id>:<ulid>
    created_at: <ISO-8601 timestamp with timezone>
    source: local_project
    operation: cloud_browser_open|penpot_task
    action: inspect|capture|create|update
    target:
      url: https://design.penpot.app/#/view/<file-id>?page-id=<page-id>
      file_id: <penpot-file-id>
      page_id: <penpot-page-id>
      shape_id: <penpot-shape-id or null>
    input_refs:
      - artifact_id: ui-visual:<project-id>:<revision>
        uri: repo://game-pipeline/ui/visual/<input-snapshot>.yaml
        sha256: <64-lowercase-hex>
    constraints:
      read_only: true
      requested_capabilities: [read:penpot, capture:penpot]
      timeout_seconds: 120
    local_note: <why this request is needed; no credentials>

  # The receiver appends this section.  An accepted ack is not proof that a
  # Penpot mutation happened; it only proves that the request was received and
  # the cloud-browser connection evidence was recorded.
  ack:
    ack_id: penpot-ack:<project-id>:<ulid or null>
    status: pending|accepted|rejected
    at: <ISO-8601 timestamp or null>
    receiver: dot_cloud_browser
    request_digest: <64-lowercase-hex or null>
    connection_evidence:
      status: pending|verified|failed
      observed_at: <ISO-8601 timestamp or null>
      browser: cloud_browser
      browser_session_id: <opaque session id or null>
      tab_id: <opaque tab id or null>
      origin: https://design.penpot.app
      evidence_ref:
        artifact_id: penpot-connection:<project-id>:<revision>
        uri: repo://game-pipeline/ui/evidence/<connection-evidence>.yaml
        sha256: <64-lowercase-hex>
      failure:
        code: <connection_failed|auth_required|origin_mismatch|timeout or null>
        detail: <failure detail or null>
        retryable: <true|false or null>
        route: BRIDGE|UI_VISUAL|UI_STRUCTURE|UI_TECH|UI_READABILITY|HUMAN_REVIEW|null
    note: <acknowledgement note or null>

  # The receiver appends this section after the requested operation.  It must
  # include a local evidence reference for success; a URL alone is not evidence.
  result:
    result_id: penpot-result:<project-id>:<ulid or null>
    status: pending|succeeded|failed|blocked
    completed_at: <ISO-8601 timestamp or null>
    request_digest: <64-lowercase-hex or null>
    ack_digest: <64-lowercase-hex or null>
    output:
      state: <what was observed or changed or null>
      evidence_refs:
        - artifact_id: penpot-operation:<project-id>:<revision>
          uri: repo://game-pipeline/ui/evidence/<operation-evidence>.yaml
          sha256: <64-lowercase-hex>
      penpot_refs:
        file_id: <penpot-file-id or null>
        page_id: <penpot-page-id or null>
        shape_ids: []
      returned_at: <ISO-8601 timestamp or null>
    failure:
      code: <operation_failed|not_connected|permission_denied|unsupported|timeout or null>
      detail: <failure detail or null>
      retryable: <true|false or null>
      route: BRIDGE|UI_VISUAL|UI_STRUCTURE|UI_TECH|UI_READABILITY|HUMAN_REVIEW|null

  integrity:
    canonicalization: penpot-browser-task-canonical-json-v1
    digest_algorithm: sha256
    request_digest: <64-lowercase-hex>
    ack_digest: <64-lowercase-hex>
    result_digest: <64-lowercase-hex>
