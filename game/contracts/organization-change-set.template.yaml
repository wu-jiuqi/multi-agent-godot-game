organization_change_set:
  schema_version: "0.2-alpha"

  identity:
    change_set_id: "chg:<project_id>:<26 位 ULID>"
    project_id: "<项目 ID>"
    title: "<供人类审批的简短标题>"
    created_at: "<ISO 8601 时间>"
    created_by:
      actor_kind: "human | instance"
      actor_id: "<稳定 Actor ID>"
      acting_position_id: null

  base:
    organization_revision: 1
    snapshot_digest: "<提案所依据 Snapshot 的 64 位小写 SHA-256>"
    decision_basis_digest: "<从正式编制、治理绑定、临时授权、ID 索引与 tombstone 计算的 SHA-256>"

  proposal:
    rationale: "<为什么需要改变长期组织或授权边界>"
    operations: []

  impact:
    affected_department_ids: []
    affected_position_ids: []
    affected_grant_ids: []
    responsibility_coverage: ["<新增、改变或移除的责任>"]
    risk_level: "low | medium | high"
    reversibility: "reversible | compensating_change_required | irreversible"
    migration_refs: []

  verification:
    preconditions: []
    automated_checks: []
    reviewer_notes: []

  approval_requirement:
    human_approval_required: true
    required_approver_role: "<有权批准组织变更的人类角色>"
    required_authority_scope: "organization.change.apply"
    decision_deadline: null

  integrity:
    canonicalization: "organization-change-set-canonical-json-v1"
    digest_algorithm: "sha256"
    change_set_digest: "<将本字段设为 null 后计算的 64 位小写 SHA-256>"

change_set_contract:
  fact_boundary: "Change Set 是待审批提案，不是当前组织事实；只有批准后的 apply Event 才能改变 Snapshot。"
  approval_binding: "人工决定必须同时绑定 change_set_id、change_set_digest、base.organization_revision、base.snapshot_digest 与 base.decision_basis_digest。"
  stale_rule: "提交和决定事件可以推进全局 revision；应用前必须验证历史中的 base Snapshot 摘要，并要求当前 decision_basis_digest 仍与 base 一致。正式编制、治理绑定、临时授权、ID 占用或 tombstone 变化会使 Change Set 进入 stale，必须重建并重新确认。"
  decision_basis_rule: "decision_basis_digest 只覆盖 project_id、governance_bindings、formal_structure、runtime.temporary_grants、governance.used_identity_index 与 governance.tombstones；排除事件水位、运行实例、审批队列和 latest_applied_change_set，避免提案因自己的提交/决定事件自我失效。"
  materialization_rule: "after 对象中只有 $apply.event_id、$apply.recorded_at、$approval.decision_ref 和 $change_set.digest 四个保留令牌可在应用时确定性解析；禁止自然语言占位符或批准后任意补值。"
  atomicity_rule: "同一 Change Set 的 operations 按数组顺序作为一个原子 mutation 校验和应用；任一操作失败则全部失败。"
  no_patch_rule: "禁止 JSON Patch、任意路径写入和自然语言替换；只允许下列类型化 operation。"
  draft_rule: "Change Set 可以由 Agent 自动生成；所有长期 Department、Position、Preset 绑定和临时授权上限变更在应用前都需要人工批准。"

operation_contracts:
  create_department:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "before 必须为 null；after 必须是完整 Department，可使用契约保留的确定性令牌。"
  update_department:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "before/after 必须是完整 Department；不得改变 department_id。"
  create_position:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "before 必须为 null；after 必须是完整 Position，可使用契约保留的确定性令牌。"
  update_position:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "before/after 必须是完整 Position；不得改变 position_id。"
  issue_temporary_grant:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "before 必须为 null；after 必须是完整且限制有限的 Temporary Grant。"
  revoke_temporary_grant:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "after 必须保留原 grant_id 并写入 revoked_at；不得通过更新扩大原授权。"
  transition_department:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "只允许 Organization Lifecycle 中需人工审批的长期转换。"
  transition_position:
    required_fields: [operation_id, operation_type, target_id, before, after, reason]
    rule: "只允许 Organization Lifecycle 中需人工审批的长期转换。"
  migrate_governance_binding:
    required_fields: [operation_id, operation_type, target_id, before, after, reason, migration_check_ref]
    rule: "必须提供兼容性检查引用，且 before/after 均为不可变绑定。"

operation_example:
  operation_id: "op-001"
  operation_type: create_position
  target_id: "pos:<project_id>:<department_slug>:<slug>"
  before: null
  after: "<完整 Position 对象>"
  reason: "<该岗位为何是长期责任而不是一次性 Task 或临时实例>"
